"$schema" = "https://starship.rs/config-schema.json"

# ─────────────────────────────────────────────────────────────────────────────
# Powerlevel10k rainbow → Starship 1:1 migration (round-corner variant)
#
# Source: ~/.p10k.zsh (nerdfont-v3 + powerline, rainbow, 1 line, compact).
# Variant: rounded caps via  (left half-circle) and  (right
# half-circle) instead of sharp triangles.
#
# Layout:
#   LEFT  : os_icon → dir → git
#   RIGHT : status / cmd_duration / jobs / python / nodejs / ruby /
#           kube / aws / azure / gcloud / context / time
#
# Color map (ANSI 256 → hex):
#   0=#000000  1=#cc0000  2=#00cc00  3=#cccc00  4=#0066cc  5=#cc00cc
#   6=#00cccc  7=#cccccc  8=#666666
#   232=#080808  250=#bcbcbc  254=#e4e4e4  255=#eeeeee
# ─────────────────────────────────────────────────────────────────────────────

format = """
[](fg:#cccccc)\
$os\
[](fg:#cccccc bg:#0066cc)\
$directory\
[](fg:#0066cc bg:#00cc00)\
$git_branch\
$git_status\
$git_state\
[](fg:#00cc00)\
$fill\
[](fg:#cccc00)\
$cmd_duration\
$status\
$jobs\
$kubernetes\
$aws\
$azure\
$gcloud\
$username\
$hostname\
[](fg:#cccccc bg:#000000)\
$time\
[](fg:#cccccc)\
"""

right_format = ""
add_newline = false
command_timeout = 5000
scan_timeout = 30
continuation_prompt = "[❯❯ ](fg:#666666)"

# ── Filler ────────────────────────────────────────────────────────────────────
[fill]
symbol = " "

# ── os_icon: bg=7 fg=232 ──────────────────────────────────────────────────────
[os]
disabled = false
style = "fg:#080808 bg:#cccccc"
format = "[ $symbol ]($style)"

[os.symbols]
Macos      = ""
Linux      = ""
Arch       = ""
Ubuntu     = ""
Debian     = ""
Fedora     = ""
Alpine     = ""
Redhat     = ""
Windows    = ""
Unknown    = ""

# ── dir: bg=4 fg=254, anchor fg=255 ───────────────────────────────────────────
[directory]
style = "fg:#e4e4e4 bg:#0066cc"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = ""
truncate_to_repo = false
read_only = "  "
read_only_style = "fg:#cccc00 bg:#0066cc"
home_symbol = " ~"

[directory.substitutions]
"Documents"  = "  "
"Downloads"  = "  "
"Developer"  = "  "
"Music"      = "  "
"Pictures"   = "  "
"Movies"     = "  "
"Desktop"    = "  "

# ── vcs: clean=bg2 ────────────────────────────────────────────────────────────
[git_branch]
symbol = ""
style = "fg:#000000 bg:#00cc00"
format = "[on $symbol $branch]($style)"
truncation_length = 32
truncation_symbol = "…"

[git_status]
style = "fg:#000000 bg:#00cc00"
format = '[$all_status$ahead_behind]($style)'
conflicted = " ~$count"
ahead = " ⇡$count"
behind = " ⇣$count"
diverged = " ⇣$behind_count⇡$ahead_count"
up_to_date = ""
untracked = " ?"
stashed = " *$count"
modified = " !$count"
staged = " +$count"
renamed = " »$count"
deleted = " ✘$count"

[git_state]
style = "fg:#cc0000 bg:#00cc00"
format = '[\($state( $progress_current/$progress_total)\)]($style) '
rebase = "REBASE"
merge = "MERGE"
revert = "REVERT"
cherry_pick = "CHERRY-PICK"
bisect = "BISECT"
am = "AM"
am_or_rebase = "AM/REBASE"

# ── command_execution_time: leftmost on right side, bg=3 fg=0 ────────────────
[cmd_duration]
disabled = false
min_time = 10_000
show_milliseconds = false
style = "fg:#000000 bg:#cccc00"
format = "[ took $duration ]($style)[](fg:#cccc00 bg:#000000)"

# ── status: ok=green check on bg0; error=yellow ✘ on bg1 ─────────────────────
[status]
disabled = false
style = "fg:#cccc00 bg:#cc0000"
symbol = "✘"
success_symbol = "[  ](fg:#00cc00 bg:#000000)"
not_executable_symbol = "[ ✘ ](fg:#cccc00 bg:#cc0000)"
not_found_symbol = "[ ✘ ](fg:#cccc00 bg:#cc0000)"
sigint_symbol = "[ ✘ ](fg:#cccc00 bg:#cc0000)"
signal_symbol = "[ ✘ ](fg:#cccc00 bg:#cc0000)"
format = '[ $symbol $common_meaning$signal_name$maybe_int ]($style)'
recognize_signal_code = true
map_symbol = true
pipestatus = true

# ── background_jobs: bg=0 fg=6 ───────────────────────────────────────────────
[jobs]
disabled = false
style = "fg:#00cccc bg:#000000"
symbol = ""
symbol_threshold = 1
number_threshold = 2
format = "[ $symbol $number ]($style)"

# ── language version segments: disabled by default (use `node -v` etc.) ──────
# Re-enable per-segment if you actively want a specific runtime version
# in every prompt; lazy-loaded mise/nvm/rbenv/pyenv made these mostly noise.
[python]
disabled = true

[nodejs]
disabled = true

[ruby]
disabled = true

# ── kubecontext: bg=5 fg=7 ───────────────────────────────────────────────────
[kubernetes]
disabled = false
style = "fg:#cccccc bg:#cc00cc"
symbol = "☸"
format = '[ $symbol $context( \($namespace\)) ]($style)'

# ── aws: bg=1 fg=7 ───────────────────────────────────────────────────────────
[aws]
disabled = false
style = "fg:#cccccc bg:#cc0000"
symbol = ""
format = '[ $symbol $profile(@$region) ]($style)'

# ── azure: bg=4 fg=7 ─────────────────────────────────────────────────────────
[azure]
disabled = false
style = "fg:#cccccc bg:#0066cc"
symbol = "ﴃ"
format = "[ $symbol $subscription ]($style)"

# ── gcloud: bg=4 fg=7 ────────────────────────────────────────────────────────
[gcloud]
disabled = false
style = "fg:#cccccc bg:#0066cc"
symbol = ""
format = '[ $symbol $account@$project ]($style)'

# ── username/hostname (only root or SSH): bg=0 fg=3 ──────────────────────────
[username]
disabled = false
show_always = false
style_user = "fg:#cccc00 bg:#000000"
style_root = "fg:#cc0000 bg:#000000"
format = "[ with $user ]($style)"

[hostname]
disabled = false
ssh_only = true
ssh_symbol = "@"
style = "fg:#cccc00 bg:#000000"
format = "[$ssh_symbol$hostname ]($style)"

# ── time: bg=7 fg=0 (rightmost segment) ──────────────────────────────────────
[time]
disabled = false
style = "fg:#000000 bg:#cccccc"
time_format = "%H:%M:%S"
format = "[ at $time ]($style)"
utc_time_offset = "local"

# ── Disable: prompt char (p10k disables it) ──────────────────────────────────
[character]
disabled = true
success_symbol = ""
error_symbol = ""

# ── Disable segments p10k didn't render ──────────────────────────────────────
[battery]
disabled = true

[memory_usage]
disabled = true

[package]
disabled = true

[shell]
disabled = true

[shlvl]
disabled = true

[singularity]
disabled = true

[terraform]
disabled = true

[vcsh]
disabled = true

[hg_branch]
disabled = true
